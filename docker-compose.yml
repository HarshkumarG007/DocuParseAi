version: '3.8'

services:
  api:
    build: .
    container_name: docuparse_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build: .
    container_name: docuparse_ui
    command: streamlit run src/ui/app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - api
    restart: unless-stopped
